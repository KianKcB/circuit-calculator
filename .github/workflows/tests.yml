name: Tests and installed distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -m pip install -r requirements/build.txt
      - name: Build source archive and wheel from source archive
        run: python -m build
      - name: Verify fresh core-only and DC installations outside checkout
        run: python -B scripts/check_distributions.py

  gui:
    name: Installed Tk / Ubuntu 24.04 / Python ${{ matrix.python }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install explicit virtual display and Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth tk
      - name: Install build frontend
        run: python -m pip install -r requirements/build.txt
      - name: Build source archive and wheel
        run: python -m build
      - name: Verify installed package and real Tk workflows under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1200x24" python -B scripts/check_distributions.py --gui
